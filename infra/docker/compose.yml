name: lazy-bank
services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: lazy-bank
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: lazy-bank
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazy-bank -d lazy-bank"]
      interval: 5s
      timeout: 5s
      retries: 10
  mongo:
    image: mongo:8.0
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo_data:/data/db"]
  ai:
    build:
      context: ../../services/ai
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ../../datasets/synthetic:/data/financial:ro
    env_file:
      - path: ../../services/ai/.env
        required: false
  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    env_file:
      - path: ../../services/api/.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      AI_SERVICE_URL: http://ai:8000
      WEB_ORIGIN: http://localhost:5173
    ports: ["127.0.0.1:3001:3001"]
    depends_on: [ai]
volumes:
  postgres_data:
  mongo_data:
